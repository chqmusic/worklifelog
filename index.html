.daily-no-progress{padding:8px 0}.daily-manage-modal{width:min(720px,100%)}.daily-manage-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.daily-manage-title h2{margin:0 0 4px}.daily-manage-list{margin-top:14px;max-height:58vh;overflow:auto}

.list-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid #f0f1f3;padding:9px 0}.list-row:last-child{border:0}
.life-section{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin:14px 0;box-shadow:var(--shadow)}.life-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}.life-heading h2{font-size:17px;margin:0 0 2px}.life-project-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.life-project-card{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}.life-records{margin-top:8px}.life-record-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-top:1px dashed #edf0f2;padding:7px 0;font-size:13px}.life-record-row>div{flex:1;min-width:0}.life-empty{padding:16px}.life-section .project-foot{margin-top:7px}
@media(max-width:760px){.life-project-list{grid-template-columns:1fr}.life-heading{align-items:flex-start}.head{padding:10px 14px}.head .sub{display:none}main{padding:0 12px 45px;margin-top:15px}.pagehead{align-items:flex-start}.pagehead h1{font-size:20px}.stats{grid-template-columns:repeat(2,1fr)}.project-grid{grid-template-columns:1fr}.card{padding:13px}.week-table{display:none}.mobile-week{display:block}.mobile-week .day{border:1px solid var(--line);border-radius:9px;margin:7px 0;padding:8px}.mobile-week .day h4{margin:0 0 5px}.mobile-week .day p{margin:4px 0;white-space:pre-wrap}.mobile-week .day:active{background:#f5f8ff}}

<header>
 <div class="head"><div><div class="brand">工作与生活日志助手 <small>V4.1.3 · 工作与生活双模块</small></div><div class="sub">记录事实，整理进展，形成可追溯的报告</div></div><div class="actions"><span id="dbStatus" class="notice">正在初始化…</span><button class="small" onclick="exportBackup()">导出备份</button></div></div>
 <nav class="tabs" id="tabs">
  <button class="tab active" data-page="projects">项目管理</button><button class="tab" data-page="week">项目周视图</button><button class="tab" data-page="reports">项目周报</button><button class="tab" data-page="worklifeReports">工作生活报告</button><button class="tab" data-page="daily">日常工作</button><button class="tab" data-page="life">生活记录</button><button class="tab" data-page="log">原始日志</button><button class="tab" data-page="settings">设置</button>

<script>
"use strict";
const DB_NAME="WorkLifeLogV41", DB_VERSION=1;
let idb, currentPage="projects", expandedProject=null, weekOffset=0, weekMode="all", reportWeekOffset=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const ts=()=>Date.now();
const dateAdd=(s,n)=>{let d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const weekStart=(s)=>{let d=new Date(s+"T12:00:00");let day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.toISOString().slice(0,10)};
const fmt=s=>s?`${s.slice(5,7)}-${s.slice(8,10)}`:"";
const statuses={not_started:"未开始",in_progress:"进行中",paused:"暂停",completed:"已完成",cancelled:"已取消"};
const dailyCategories=[{id:"security",name:"安全合规排查反馈"},{id:"acceptance",name:"需求验收"},{id:"confirmation",name:"需求确认"},{id:"other",name:"其他"}];
const req=(store,mode="readonly")=>idb.transaction(store,mode).objectStore(store);
function txDone(tx){return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error("事务中止"))})}
function getAll(store){return new Promise((res,rej)=>{let r=req(store).getAll();r.onsuccess=()=>res(r.result.filter(x=>!x.deletedAt));r.onerror=()=>rej(r.error)})}
function getOne(store,id){return new Promise((res,rej)=>{let r=req(store).get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)})}
async function put(store,obj){let tx=idb.transaction(store,"readwrite");tx.objectStore(store).put(obj);await txDone(tx);return obj}
async function softDelete(store,id){let obj=await getOne(store,id);if(!obj)return;obj.deletedAt=ts();obj.updatedAt=ts();await put(store,obj)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{let d=r.result;
 const create=(name,opts={keyPath:"id"})=>d.objectStoreNames.contains(name)?r.transaction.objectStore(name):d.createObjectStore(name,opts);
 let g=create("projectGroups");g.createIndex("sortOrder","sortOrder");
 let p=create("projects");p.createIndex("groupId","groupId");p.createIndex("status","status");
 let pp=create("projectProgress");pp.createIndex("projectId","projectId");pp.createIndex("progressDate","progressDate");pp.createIndex("projectDate",["projectId","progressDate"]);
 let wr=create("projectWeeklyReports");wr.createIndex("weekStart","weekStart",{unique:true});
 let wi=create("projectWeeklyReportItems");wi.createIndex("reportId","reportId");wi.createIndex("reportProject",["reportId","projectId"]);
 let dr=create("dailyRecords");dr.createIndex("recordDate","recordDate");
 let dt=create("dailyTasks");dt.createIndex("categoryId","categoryId");
 let du=create("dailyTaskUpdates");du.createIndex("taskId","taskId");du.createIndex("taskDate",["taskId","updateDate"]);
 let lr=create("lifeRecords");lr.createIndex("recordDate","recordDate");
 let lg=create("lifeGroups");lg.createIndex("sortOrder","sortOrder");
 let lp=create("lifeProjects");lp.createIndex("groupId","groupId");lp.createIndex("sortOrder","sortOrder");
 let le=create("lifeEntries");le.createIndex("projectId","projectId");le.createIndex("recordDate","recordDate");le.createIndex("projectDate",["projectId","recordDate"]);
 let drep=create("dailyReports");drep.createIndex("reportDate","reportDate",{unique:true});
 let se=create("statusEvents");se.createIndex("entity",["entityType","entityId"]);
 d.createObjectStore("appSettings",{keyPath:"key"});
 };r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function seed(){
 let groups=await getAll("projectGroups"),now=ts();
 if(!groups.length){let tx=idb.transaction("projectGroups","readwrite"),st=tx.objectStore("projectGroups");["规范指引","安全合规"].forEach((name,i)=>st.put({id:uid(),name,sortOrder:i+1,isActive:true,createdAt:now,updatedAt:now,deletedAt:null}));await txDone(tx)}
 else {let tx=idb.transaction("projectGroups","readwrite"),st=tx.objectStore("projectGroups");let guide=groups.find(x=>x.name==="制度与规范");if(guide){guide.name="规范指引";guide.updatedAt=now;st.put(guide)};for(let [name,order] of [["规范指引",1],["安全合规",2]]){let g=groups.find(x=>x.name===name)||(name==="规范指引"?guide:null);if(g){g.sortOrder=order;g.isActive=true;st.put(g)}else st.put({id:uid(),name,sortOrder:order,isActive:true,createdAt:now,updatedAt:now,deletedAt:null})}await txDone(tx)}
 const lifeNames=["英语学习","AI学习","阅读","运动","电影","辅导歪歪","辅导纽纽","公众号","整理","体重、睡眠时间","大额支出","其他"];
 let life=await getAll("lifeGroups"),ltx=idb.transaction("lifeGroups","readwrite"),lst=ltx.objectStore("lifeGroups");
 lifeNames.forEach((name,i)=>{let g=life.find(x=>x.name===name);if(g){g.sortOrder=i+1;g.isActive=true;g.updatedAt=now;lst.put(g)}else lst.put({id:uid(),name,sortOrder:i+1,isActive:true,createdAt:now,updatedAt:now,deletedAt:null})});await txDone(ltx);

 // 日常工作：把原有固定分类升级为可管理的一级事项；保留用户已创建的事项与历史进展。
 const dailyDefaults=[["security","安全合规排查反馈",10],["acceptance","需求验收",20],["confirmation","需求确认",30],["other","其他",40]];
 let dailyNow=await getAll("dailyTasks");
 let dtx=idb.transaction("dailyTasks","readwrite"), dstore=dtx.objectStore("dailyTasks");
 dailyDefaults.forEach(([id,name,sortOrder])=>{
   let found=dailyNow.find(x=>x.name===name);
   if(found){ if(found.active===undefined) found.active=true; found.sortOrder=found.sortOrder||sortOrder; found.updatedAt=now; dstore.put(found); }
   else dstore.put({id:"daily-"+id,name,status:"in_progress",startDate:"",active:true,sortOrder,createdAt:now,updatedAt:now,deletedAt:null});
 });
 // 旧版已存在的事项全部保留，并默认保持启用状态。
 dailyNow.forEach(x=>{if(x.active===undefined){x.active=true;x.updatedAt=now;dstore.put(x)}});
 await txDone(dtx);
 let existing=await getAll("lifeProjects");if(!existing.length){let gs=await getAll("lifeGroups"),tx=idb.transaction("lifeProjects","readwrite"),st=tx.objectStore("lifeProjects");for(let [groupName,items] of Object.entries(LIFE_DEFAULTS)){let g=gs.find(x=>x.name===groupName);if(g)items.forEach(([name,recordType],i)=>st.put({id:uid(),groupId:g.id,name,recordType,unit:name==="体重"?"kg":name==="睡眠时间"?"小时":"",status:"active",sortOrder:i+1,createdAt:now,updatedAt:now,deletedAt:null}))}await txDone(tx)}
 // 将已存在的“大额支出记录”项目升级为数值+文字类型；只修改项目类型，不改动任何历史记录。
 let lifeProjectsNow=await getAll("lifeProjects"),expenseGroup=(await getAll("lifeGroups")).find(g=>g.name==="大额支出"),expenseProject=lifeProjectsNow.find(p=>p.groupId===expenseGroup?.id&&p.name==="大额支出记录");if(expenseProject&&expenseProject.recordType==="text"){expenseProject.recordType="metric_text";expenseProject.updatedAt=now;await put("lifeProjects",expenseProject)}
}
let lastModalSavedValues=Object.create(null);
function modal(title,body,saveText="保存"){return new Promise(resolve=>{const root=$("modalRoot");lastModalSavedValues=Object.create(null);root.innerHTML=`<div class="modal-back" id="mb"><div class="modal" role="dialog" aria-modal="true"><h2>${title}</h2>${body}<div class="modal-actions"><button type="button" id="mc">取消</button><button type="button" class="primary" id="ms">${saveText}</button></div></div></div>`;const panel=root.querySelector(".modal");panel.addEventListener("pointerdown",e=>e.stopPropagation());panel.addEventListener("click",e=>e.stopPropagation());const close=v=>{root.innerHTML="";resolve(v)};$("mc").onclick=()=>close(null);$("mb").onclick=e=>{if(e.target.id==="mb")close(null)};$("ms").onclick=()=>{const snapshot=Object.create(null);panel.querySelectorAll("input[id],select[id],textarea[id]").forEach(el=>{snapshot[el.id]=el.type==="checkbox"?el.checked:el.value});lastModalSavedValues=snapshot;resolve(true);setTimeout(()=>{if(root.contains(panel))root.innerHTML=""},0)};const first=panel.querySelector("input:not([type=checkbox]),textarea,select");if(first)requestAnimationFrame(()=>first.focus())})}
function field(label,id,value="",type="text",extra=""){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function modalFieldValue(id){const el=document.querySelector(`#modalRoot #${id}`);if(el)return el.value;if(Object.prototype.hasOwnProperty.call(lastModalSavedValues,id))return lastModalSavedValues[id];throw new Error(`弹窗输入控件未找到：${id}。弹窗保存时也未捕获到该控件；请把此错误信息发给我。`)}
function selectOptions(obj,value){return Object.entries(obj).map(([k,v])=>`<option value="${k}" ${k===value?"selected":""}>${v}</option>`).join("")}
function nav(page){currentPage=page;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render()}
$("tabs").addEventListener("click",e=>{let b=e.target.closest("[data-page]");if(b)nav(b.dataset.page)});
async function render(){if(!idb)return;try{if(currentPage==="projects")await renderProjects();else if(currentPage==="week")await renderWeek();else if(currentPage==="reports")await renderReports();else if(currentPage==="worklifeReports")await renderWorklifeReports();else if(currentPage==="daily")await renderDaily();else if(currentPage==="life")await renderLife();else if(currentPage==="log")await renderRaw();else await renderSettings()}catch(e){console.error(e);$("app").innerHTML=`<div class="card">页面加载失败：${esc(e.message)}</div>`}}
function head(title,desc,buttons=""){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${desc}</div></div><div class="actions">${buttons}</div></div>`}

 const sections=groups.filter(g=>g.isActive!==false).map(g=>{let list=projects.filter(p=>p.groupId===g.id);return `<section class="life-section"><div class="life-heading"><div><h2>${esc(g.name)}</h2><span class="notice">${list.length} 个项目</span></div><div class="actions"><button class="small" onclick="editLifeGroup('${g.id}')">编辑框架</button><button class="small primary" onclick="editLifeProject(null,'${g.id}')">＋ 新项目</button></div></div>${list.length?`<div class="life-project-list">${list.map(p=>{let recent=entries.filter(e=>e.projectId===p.id).slice(0,4);return `<article class="life-project-card"><div class="project-top"><div><div class="project-name">${esc(p.name)}</div><div class="meta">${esc(LIFE_TYPES[p.recordType]||p.recordType)} · ${p.status==='completed'?'已完成':'进行中'}</div></div><button class="small" onclick="editLifeProject('${p.id}')">编辑</button></div><div class="life-records">${recent.map(e=>`<div class="life-record-row"><div><b>${e.recordDate}</b><div>${lifeEntrySummary(e)}</div>${e.note?`<div class="meta">${esc(e.note)}</div>`:''}</div><button class="small" onclick="editLifeEntry('${e.id}')">编辑</button><button class="small danger" onclick="removeLifeEntry('${e.id}')">删除</button></div>`).join('')||'<div class="notice">暂无记录</div>'}</div><div class="project-foot"><button class="small primary" onclick="addLifeEntry('${p.id}')">＋ 记一条</button></div></article>`}).join('')}</div>`:'<div class="empty life-empty">这个框架还没有项目，点击“＋ 新项目”创建。</div>'}</section>`}).join('');
 $('app').innerHTML=head("生活记录","所有框架在同一页面纵向展示；按框架 → 项目 → 每日记录组织，与工作日志相互独立。",`<button onclick="editLifeGroup()">＋ 新框架</button><button class="primary" onclick="editLifeProject()">＋ 新项目</button>`)+sections;
}
function lifeEntrySummary(e){if(e.type==='check')return e.checked?'已打卡':'未打卡';if(e.type==='steps')return `步数：${esc(e.value||0)} 步`;if(['metric','metric_text'].includes(e.type))return `${esc(e.value||'')} ${esc(e.unit||'')}`.trim();if(e.type==='duration_note')return `时长：${esc(e.duration||'未填写')}`;if(e.type==='count_duration')return `数量：${esc(e.count||'')} · 时长：${esc(e.duration||'')}`;return e.type==='text'?'文字记录':'';}
async function editLifeGroup(id=null){let g=id?await getOne('lifeGroups',id):null;let body=`${field('框架名称','lgName',g?.name||'')}`;if(!await modal(g?'编辑生活框架':'新建生活框架',body))return;let name=$('lgName').value.trim();if(!name)return alert('框架名称不能为空');let all=await getAll('lifeGroups'),now=ts();await put('lifeGroups',{id:g?.id||uid(),name,sortOrder:g?.sortOrder??(Math.max(0,...all.map(x=>x.sortOrder||0))+1),isActive:true,createdAt:g?.createdAt||now,updatedAt:now,deletedAt:null});lifeSelectedGroup=g?.id||'';await renderLife()}
async function moveLifeGroup(delta){let a=(await getAll('lifeGroups')).sort((x,y)=>x.sortOrder-y.sortOrder),i=a.findIndex(x=>x.id===lifeSelectedGroup),j=i+delta;if(i<0||j<0||j>=a.length)return;[a[i].sortOrder,a[j].sortOrder]=[a[j].sortOrder,a[i].sortOrder];await Promise.all([put('lifeGroups',a[i]),put('lifeGroups',a[j])]);await renderLife()}
async function editLifeProject(id=null,requestedGroupId=null){
 try{
  let [groups,p]=await Promise.all([getAll('lifeGroups'),id?getOne('lifeProjects',id):Promise.resolve(null)]);
  groups.sort((a,b)=>a.sortOrder-b.sortOrder);
  if(!groups.length){alert('当前没有生活框架，请先创建框架。');return}
  const chosenGroup=p?.groupId||requestedGroupId||lifeSelectedGroup||'';
  let opts=`<option value="">请选择所属框架</option>`+groups.map(g=>`<option value="${g.id}" ${chosenGroup===g.id?'selected':''}>${esc(g.name)}</option>`).join('');
  let body=`${field('项目名称','lpName',p?.name||'')}<div class="field"><label>所属框架</label><select id="lpGroup">${opts}</select></div><div class="field"><label>记录类型</label><select id="lpType">${Object.entries(LIFE_TYPES).map(([k,v])=>`<option value="${k}" ${p?.recordType===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>单位（数值类适用）</label><input id="lpUnit" value="${esc(p?.unit||'')}" placeholder="如 kg、小时、分钟"></div><div class="field"><label>状态</label><select id="lpStatus"><option value="active" ${p?.status!=='completed'?'selected':''}>进行中</option><option value="completed" ${p?.status==='completed'?'selected':''}>已完成</option></select></div>`;
  if(!await modal(p?'编辑生活项目':'新建生活项目',body))return;
  let name=modalFieldValue('lpName').trim(),groupId=modalFieldValue('lpGroup');
  if(!name){alert('项目名称不能为空');document.querySelector('#modalRoot #lpName')?.focus();return}
  if(!groupId){alert('请先选择所属框架');document.querySelector('#modalRoot #lpGroup')?.focus();return}
  let now=ts(),all=await getAll('lifeProjects');
  let obj={id:p?.id||uid(),groupId,name,recordType:modalFieldValue('lpType'),unit:modalFieldValue('lpUnit').trim(),status:modalFieldValue('lpStatus'),sortOrder:p?.sortOrder??(Math.max(0,...all.filter(x=>x.groupId===groupId).map(x=>x.sortOrder||0))+1),createdAt:p?.createdAt||now,updatedAt:now,deletedAt:null};
  await put('lifeProjects',obj);
  lifeSelectedGroup=groupId;lifeSelectedProject=obj.id;
  await renderLife();
  toast(p?'生活项目已更新':'生活项目已创建');
 }catch(err){console.error('保存生活项目失败',err);alert('项目保存失败：'+(err?.message||String(err))+'。原有数据未主动删除，请重试或把错误信息发给我。')}
}
async function addLifeEntry(projectId){let p=await getOne('lifeProjects',projectId);if(!p)return;let extra='';if(p.recordType==='check')extra='<div class="field"><label><input id="leChecked" type="checkbox" checked> 今日已完成 / 已打卡</label></div>';else if(p.recordType==='steps')extra=field('步数','leValue','','number');else if(['metric','metric_text'].includes(p.recordType))extra=field('数值 / 金额','leValue','','number')+field('单位（可覆盖项目默认单位）','leUnit',p.unit||'')+(p.recordType==='metric_text'?'<div class="field"><label>文字说明</label><textarea id="leNote" placeholder="填写用途、对象或补充说明"></textarea></div>':'');else if(p.recordType==='duration_note')extra=field('时长（分钟或小时）','leDuration','','text')+'<div class="field"><label>心得 / 内容</label><textarea id="leNote"></textarea></div>';else if(p.recordType==='count_duration')extra=field('数量（如题数、页数）','leCount','','number')+field('时长','leDuration','')+'<div class="field"><label>补充说明</label><textarea id="leNote"></textarea></div>';else extra='<div class="field"><label>记录内容</label><textarea id="leNote"></textarea></div>';let body=`${field('记录日期','leDate',today(),'date')}${extra}`;if(!await modal('新增生活记录 · '+p.name,body))return;let now=ts(),e={id:uid(),projectId,recordDate:$('leDate').value,type:p.recordType,checked:p.recordType==='check'?$('leChecked').checked:undefined,value:['steps','metric','metric_text'].includes(p.recordType)?$('leValue').value:undefined,unit:['metric','metric_text'].includes(p.recordType)?($('leUnit').value||p.unit):p.unit,duration:['duration_note','count_duration'].includes(p.recordType)?$('leDuration').value:undefined,count:p.recordType==='count_duration'?$('leCount').value:undefined,note:['duration_note','count_duration','text','metric_text'].includes(p.recordType)?$('leNote').value.trim():'',createdAt:now,updatedAt:now,deletedAt:null};await put('lifeEntries',e);lifeSelectedProject=projectId;await renderLife()}
async function editLifeEntry(id){let e=await getOne('lifeEntries',id),p=await getOne('lifeProjects',e.projectId);if(!e||!p)return;let body=`${field('记录日期','leDate',e.recordDate,'date')}`;if(e.type==='check')body+='<div class="field"><label><input id="leChecked" type="checkbox" '+(e.checked?'checked':'')+'> 已完成 / 已打卡</label></div>';if(['steps','metric','metric_text'].includes(e.type))body+=field(e.type==='metric_text'?'数值 / 金额':'数值','leValue',e.value||'','number');if(['metric','metric_text'].includes(e.type))body+=field('单位','leUnit',e.unit||'');if(['duration_note','count_duration'].includes(e.type))body+=field('时长','leDuration',e.duration||'');if(e.type==='count_duration')body+=field('数量','leCount',e.count||'','number');if(['duration_note','count_duration','text','metric_text'].includes(e.type))body+=`<div class="field"><label>${e.type==='metric_text'?'文字说明':'记录内容 / 心得'}</label><textarea id="leNote">${esc(e.note||'')}</textarea></div>`;if(!await modal('编辑生活记录',body))return;e.recordDate=$('leDate').value;if(e.type==='check')e.checked=$('leChecked').checked;if(['steps','metric','metric_text'].includes(e.type))e.value=$('leValue').value;if(['metric','metric_text'].includes(e.type))e.unit=$('leUnit').value;if(['duration_note','count_duration'].includes(e.type))e.duration=$('leDuration').value;if(e.type==='count_duration')e.count=$('leCount').value;if(['duration_note','count_duration','text','metric_text'].includes(e.type))e.note=$('leNote').value.trim();e.updatedAt=ts();await put('lifeEntries',e);await renderLife()}
async function removeLifeEntry(id){if(!confirm('删除这条生活记录？'))return;await softDelete('lifeEntries',id);await renderLife()}
async function renderRaw(){let rows=(await getAll("dailyRecords")).sort((a,b)=>b.recordDate.localeCompare(a.recordDate)||b.createdAt-a.createdAt);$("app").innerHTML=head("原始日志","先把当天发生的事情原样记下来；后续可逐条整理归类。",`<button class="primary" onclick="addRaw()">＋ 新增原始日志</button>`)+`<div class="card">${rows.map(x=>`<div class="list-row"><div><b>${x.recordDate}</b><div>${esc(x.content)}</div><div class="notice">分类：${x.category||"未分类"} · 状态：${x.conversionStatus||"待整理"}</div></div><button class="small" onclick="classifyRaw('${x.id}')">整理归类</button></div>`).join("")||'<div class="empty">还没有原始日志记录。</div>'}</div>`}
async function addRaw(){let body=`${field("日期","rawDate",today(),"date")}<div class="field"><label>今天发生了什么？支持多条，换行分隔</label><textarea id="rawContent" style="min-height:150px"></textarea></div>`;if(!await modal("新增原始日志",body,"保存记录"))return;let lines=$("rawContent").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return alert("请输入内容");let now=ts(),tx=idb.transaction("dailyRecords","readwrite"),s=tx.objectStore("dailyRecords");lines.forEach(content=>s.put({id:uid(),recordDate:$("rawDate").value,content,category:"unclassified",conversionStatus:"pending",convertedType:null,convertedId:null,createdAt:now,updatedAt:now,deletedAt:null}));await txDone(tx);await renderRaw()}
async function classifyRaw(id){let x=await getOne("dailyRecords",id);let body=`<div class="notice">${esc(x.content)}</div><div class="field"><label>归类</label><select id="rawType"><option value="project">项目进展</option><option value="daily">日常工作进展</option><option value="life">生活记录</option><option value="ignore">暂不转化</option></select></div><div class="field"><label>选择关联对象（如适用）</label><select id="rawTarget"></select></div>`;let projects=await getAll("projects"),tasks=await getAll("dailyTasks");if(!await modal("整理原始日志",body,"确认归类"))return;let type=$("rawType").value,target=$("rawTarget");if(type==="project"){target.innerHTML=projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}x.category=type==="ignore"?"unclassified":type;x.conversionStatus=type==="ignore"?"ignored":"pending";x.updatedAt=ts();await put("dailyRecords",x);if(type==="ignore"){await renderRaw();return}let list=type==="project"?projects:tasks;if(type==="life"){await put("lifeRecords",{id:uid(),recordDate:x.recordDate,content:x.content,category:"其他",tags:[],createdAt:ts(),updatedAt:ts(),deletedAt:null});x.conversionStatus="converted";x.convertedType="lifeRecord"}else{let targetId=prompt("请输入目标对象序号（从1开始）：\n"+list.map((a,i)=>`${i+1}. ${a.name}`).join("\n"),"1");let obj=list[Number(targetId)-1];if(!obj){x.conversionStatus="pending";await put("dailyRecords",x);return}if(type==="project"){let now=ts(),newp={id:uid(),projectId:obj.id,progressDate:x.recordDate,content:x.content,batchId:uid(),batchOrder:1,createdAt:now,updatedAt:now,deletedAt:null};await put("projectProgress",newp);x.convertedType="projectProgress";x.convertedId=newp.id}else{let now=ts(),newp={id:uid(),taskId:obj.id,updateDate:x.recordDate,content:x.content,sourceRecordId:x.id,batchId:uid(),batchOrder:1,createdAt:now,updatedAt:now,deletedAt:null};await put("dailyTaskUpdates",newp);x.convertedType="dailyTaskUpdate";x.convertedId=newp.id}x.conversionStatus="converted"}x.updatedAt=ts();await put("dailyRecords",x);await renderRaw()}
async function renderSettings(){$("app").innerHTML=head("设置","V4.1 本地数据管理。V4.1 使用独立全新数据库，不会覆盖 V4.0 数据。")+`<div class="card"><h3>数据与隐私</h3><p>所有记录保存在当前浏览器的 IndexedDB 中，不会自动上传到服务器。请定期导出备份。</p><button class="primary" onclick="exportBackup()">导出 JSON 备份</button><button onclick="document.getElementById('backupFile').click()">导入备份并恢复</button><input id="backupFile" type="file" accept=".json,application/json" style="display:none" onchange="importBackupFile(this.files?.[0]);this.value=''"><button class="danger" onclick="resetDB()">清空 V4.1 数据库</button><p class="notice">导入会用备份文件完整替换当前浏览器中的 V4.1 数据。导入前会先自动下载当前数据备份。</p></div><div class="card"><h3>当前版本</h3><p>V4.1.3 · IndexedDB · schema version ${DB_VERSION}</p><p class="notice">删除采用软删除；导出备份包含业务表记录。清空数据库不可恢复，请先备份。</p></div>`}
async function exportBackup(){let stores=["projectGroups","projects","projectProgress","projectWeeklyReports","projectWeeklyReportItems","dailyRecords","dailyTasks","dailyTaskUpdates","lifeRecords","lifeGroups","lifeProjects","lifeEntries","dailyReports","statusEvents","appSettings"],data={app:"WorkLifeLogV41",version:DB_VERSION,exportedAt:new Date().toISOString(),tables:{}};for(let s of stores)data.tables[s]=await new Promise((res,rej)=>{let r=req(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`worklife-v4.1-backup-${today()}.json`;a.click();URL.revokeObjectURL(url)}
async function importBackupFile(file){
 if(!file)return;
 let data;
 try{data=JSON.parse(await file.text())}catch(e){alert('文件无法解析为有效 JSON，未修改当前数据。');return}
 const stores=["projectGroups","projects","projectProgress","projectWeeklyReports","projectWeeklyReportItems","dailyRecords","dailyTasks","dailyTaskUpdates","lifeRecords","lifeGroups","lifeProjects","lifeEntries","dailyReports","statusEvents","appSettings"];
 if(!data||data.app!=="WorkLifeLogV41"||!data.tables||typeof data.tables!=="object"){
  alert('这不是工作与生活日志助手 V4.1 的备份文件，未修改当前数据。');return;
 }
 for(const name of stores){
  if(!Array.isArray(data.tables[name])){alert('备份文件缺少数据表或格式不正确：'+name+'。未修改当前数据。');return;}
  for(const row of data.tables[name]){
   if(!row||typeof row!=='object'||(name==='appSettings'?!('key' in row):!('id' in row))){alert('备份文件中的 '+name+' 存在无效记录，未修改当前数据。');return;}
  }
 }
 const total=stores.reduce((n,k)=>n+data.tables[k].length,0);
 if(!confirm(`即将从备份恢复 ${total} 条数据。\n\n注意：这会完整替换当前浏览器中的 V4.1 数据，不会与现有数据合并。\n\n继续前，程序会先自动下载当前数据作为安全备份。确认继续吗？`))return;
 try{
  await exportBackup();
  const tx=idb.transaction(stores,'readwrite');
  for(const name of stores){const os=tx.objectStore(name);os.clear();for(const row of data.tables[name])os.put(row)}
  await txDone(tx);
  alert('备份恢复成功！页面即将刷新。');location.reload();
 }catch(err){
  console.error('备份恢复失败',err);
  alert('备份恢复失败：'+(err?.message||String(err))+'。请保留原备份文件，不要清空数据库，并把错误信息发给我。');
 }
}
async function resetDB(){if(!confirm("确定永久清空全部 V4.1 数据？建议先导出备份。"))return;idb.close();await new Promise((res,rej)=>{let r=indexedDB.deleteDatabase(DB_NAME);r.onsuccess=res;r.onerror=()=>rej(r.error)});location.reload()}
function toast(msg){let n=document.createElement("div");n.textContent=msg;n.style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#263548;color:#fff;padding:10px 16px;border-radius:9px;z-index:99;box-shadow:0 4px 20px #0002";document.body.appendChild(n);setTimeout(()=>n.remove(),2200)}
(async()=>{try{idb=await openDB();await seed();$("dbStatus").textContent="本地数据库已就绪";await render()}catch(e){$("dbStatus").textContent="数据库初始化失败";$("app").innerHTML=`<div class="card">初始化失败：${esc(e.message)}。请使用支持 IndexedDB 的现代浏览器打开。</div>`;console.error(e)}})();
</script>
